gamepad = "any"

# --- Back to the title ---
[actions.restart]
kind = "button"
[[actions.restart.bindings]]
type = "key"
code = "KeyR"
[[actions.restart.bindings]]
type = "gamepad_button"
button = "North"
gamepad = "any"


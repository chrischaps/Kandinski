# The whole sky of Kandinski, painted where nothing was drawn: a vertical
# gradient, hashed stars, a band of light on the horizon and the striped sun.
# It is an hdr style that feeds bloom, so the sun and the horizon line glow
# by themselves. Every colour and number is a param that scripts/drive.rhai
# cross-fades between stages with set_post_style_param.
# Generated by tools/gen_horizon_toml.py.
version = 1
name = "horizon"
label = "Horizon (sky + sun)"
stage = "hdr"
shader = "horizon.wgsl"
inputs = ["depth"]
feeds_bloom = true

[params.sky_top_r]
default = 0.05
min = 0.0
max = 1.0
help = "Sky colour overhead"

[params.sky_top_g]
default = 0.02
min = 0.0
max = 1.0

[params.sky_top_b]
default = 0.16
min = 0.0
max = 1.0

[params.sky_low_r]
default = 0.55
min = 0.0
max = 1.0
help = "Sky colour just above the horizon"

[params.sky_low_g]
default = 0.1
min = 0.0
max = 1.0

[params.sky_low_b]
default = 0.45
min = 0.0
max = 1.0

[params.glow_r]
default = 1.0
min = 0.0
max = 1.0
help = "The band of light lying on the horizon"

[params.glow_g]

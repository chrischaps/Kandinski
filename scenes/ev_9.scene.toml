# ================================================================
#  AFTERGLOW  -  outrun the dark   (working name: Kandinski)
# ================================================================
#  GENERATED by tools/build_scene.py: edit that, not this.
#
#  A high-speed drive in the line of Rad Racer and OutRun: the five-stage
#  ARCADE run, the fifteen events of the GRAND TOUR, and HORIZON. The world is a treadmill: the car stays at the origin
#  and scripts/drive.rhai re-places 64 road tiles and the pooled
#  scenery under it every frame, shearing tiles sideways for curves
#  and pitching them for hills.
#
#    play.bat
#
#  W / Up      accelerate          A D / Left Right   steer
#  S / Down    brake               Space              handbrake
#  Shift       boost               Enter              confirm
#  P           pause               R                  restart the event (arcade: title)
#  Menus: arrows / WASD, Enter, Backspace
#  Gamepad: stick steers, RT accelerates, LT brakes, A handbrake,
#           X / RB boost, Start / A confirm, B back, Back pauses
# ================================================================

[scene]
name = "Afterglow"
version = "1.0"
description = "Outrun the dark: a retro high-speed drive"
input_config = "config/input.toml"

[camera]
position = [0.0, 2.3, 7.4]
target = [0.0, 1.1, -30.0]
fov = 62.0
near = 0.3
far = 4000.0

# The world is unlit: a flat ambient of 3 and no sun, so a material's colour
# is its radiance. Colour 1 is radiance 3, which blooms; the road is ~0.005.
[environment]
ambient_sky = [3.0, 3.0, 3.0]
ambient_ground = [3.0, 3.0, 3.0]

[post_process]
bloom_enabled = true
bloom_intensity = 0.22
bloom_threshold = 1.0
exposure = 1.0
fog_enabled = true
fog_color = [0.30, 0.03, 0.16]
fog_density = 0.0030
fog_start = 60.0

# The sky and the sun (styles/horizon.*). drive.rhai owns every value.
[post_process.styles.horizon]

# Scenery is drawn in glyphs; the table is only the preset for those entities.
[post_process.styles.ascii]
scope = "entities"
cell = 6
color = "source"
ground = "black"
edges = 1.0
edge_ink = "hue"
glow = 0.5
ink = 1.3
exposure = 1.0
outline = 1.0
smoothing = 0.2

# Glow that crosses glyph cells, so the glyph scenery reads as lit tubes.
[post_process.styles.display_bloom]
intensity = 0.9
threshold = 0.62
levels = 5

# The glass (styles/crt.*).
[post_process.styles.crt]

[entities.sun]
[entities.sun.light]
type = "directional"
direction = [0.0, 1.0, 0.0]
color = [1.0, 1.0, 1.0]
intensity = 0.0

# ── Game ────────────────────────────────────────────────────────
[entities.game]
[entities.game.game_state]
autopilot = true
start_stage = 0
start_speed = 0.0
manual = false
telemetry = false
telemetry_hz = 10.0
test_wide = false
cruise = 0.0
test_track = false
test_curve = 0.0
traffic = true
start_boost = 0.0
ap_skill = 1.0
ap_style = 0
ap_assist = false
ghost_rivals = false
start_event = 9
no_clock = false
persist = false
[entities.game.script]
source = "drive.rhai"

[entities.hud]
[entities.hud.script]
source = "hud.rhai"

[entities.audio]
[entities.audio.script]
source = "audio.rhai"

# ── Audio loops: autoplay at volume 0, scripts/audio.rhai fades them ──
[entities.snd_engine_low]
[entities.snd_engine_low.audio_source]
file = "audio/engine_low.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.0
bus = "sfx"

[entities.snd_engine_high]
[entities.snd_engine_high.audio_source]
file = "audio/engine_high.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.0
bus = "sfx"

[entities.snd_wind]
